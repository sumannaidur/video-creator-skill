<!doctype html>
<html lang="und">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Explainer host</title>
<link rel="stylesheet" href="paper.css">
<link rel="stylesheet" href="story.css">
<style>:root { --vc-font: "Nirmala UI","Segoe UI",sans-serif }</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="fibers"><feTurbulence type="fractalNoise" baseFrequency=".66" numOctaves="3" seed="9"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
</svg>
<main class="story-frame">
  <svg class="grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#fibers)"/></svg>
  <aside class="debug" hidden data-text></aside>
  <div class="story-safe" data-safe>
    <section class="story-body">
      <h1 class="story-title" data-text data-required="title"></h1>
      <div class="story-stage" data-required="illustration stage"></div>
    </section>
    <footer class="caption story-caption" data-text data-required="narration caption"></footer>
  </div>
</main>
<script src="view.js"></script>
