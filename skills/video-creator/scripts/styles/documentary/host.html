<!doctype html>
<html lang="und">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentary host</title>
<link rel="stylesheet" href="doc.css">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="doc-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
</svg>
<main class="story-frame">
  <aside class="debug" hidden data-text></aside>
  <div class="story-safe" data-safe>
    <section class="story-body">
      <h1 class="story-title" data-text data-required="title"></h1>
      <div class="story-stage" data-required="illustration stage"></div>
    </section>
    <footer class="caption story-caption" data-text data-required="narration caption"></footer>
  </div>
</main>
<!-- the scene view is shared with the shot core (Tech Explainer) -->
<script src="../tech-explainer/view.js"></script>
