<!doctype html>
<html lang="und">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard host</title>
<link rel="stylesheet" href="board.css">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wb-bleed" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation=".6"/></filter>
  </defs>
</svg>
<main class="story-frame">
  <aside class="debug" hidden data-text></aside>
  <div class="story-safe" data-safe>
    <section class="story-body">
      <h1 class="story-title" data-text data-required="title"></h1>
      <div class="story-stage" data-required="illustration stage"></div>
    </section>
    <footer class="caption story-caption" data-text data-required="narration caption"></footer>
  </div>
</main>
<!-- the scene view is shared with the shot core (Tech Explainer) -->
<script src="../tech-explainer/view.js"></script>
