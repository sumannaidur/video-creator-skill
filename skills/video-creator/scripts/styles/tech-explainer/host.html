<!doctype html>
<html lang="und">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Explainer host</title>
<link rel="stylesheet" href="tech.css">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="tk-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="tk-bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
</svg>
<main class="story-frame">
  <aside class="debug" hidden data-text></aside>
  <div class="story-safe" data-safe>
    <section class="story-body">
      <h1 class="story-title" data-text data-required="title"></h1>
      <div class="story-stage" data-required="illustration stage"></div>
    </section>
    <footer class="caption story-caption" data-text data-required="narration caption"></footer>
  </div>
</main>
<script src="view.js"></script>
