<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Explainer · Flight fares</title>
<link rel="stylesheet" href="paper.css">
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="fuel" viewBox="0 0 48 48"><path d="M24 4C19 14 9 21 9 31a15 15 0 0 0 30 0c0-10-10-17-15-27Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M15 31c0 6 4 9 8 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="people" viewBox="0 0 48 48"><circle cx="20" cy="15" r="7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M7 39v-6c0-10 26-10 26 0v6ZM32 9a7 7 0 0 1 0 14m4 3c6 2 6 6 6 12" fill="none" stroke="currentColor" stroke-width="3"/></symbol>
  <symbol id="tools" viewBox="0 0 48 48"><path d="M30 7a11 11 0 0 0-11 14L6 34a5 5 0 0 0 7 7l13-13A11 11 0 0 0 40 15l-7 7-7-7 7-8Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="terminal" viewBox="0 0 48 48"><path d="M5 41h38M8 41V24h32v17M18 24l3-13h6l3 13M16 32h3m4 0h3m4 0h3M31 11H17V6h14Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="seat" viewBox="0 0 48 48"><path d="M10 7c3-1 5 0 6 4l6 16h14a4 4 0 0 1 0 8H18c-4 0-6-2-7-5L5 13c-1-3 2-6 5-6Zm10 29-4 7m14-7 4 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
</svg>
<main class="frame">
  <div class="safe" data-safe>
    <header class="mast" data-required="masthead">
      <span class="brand" data-text>Paper Explainer</span><span class="micro" data-text id="sequence"></span>
    </header>
    <div id="scene"></div>
    <footer class="caption" data-required="caption" data-text id="caption"></footer>
  </div>
</main>
<template id="hook">
  <section class="split" style="height:100%">
    <div data-required="hook copy">
      <p class="section" data-text>Airfare, unpacked</p>
      <h1 data-text>Why are flights so expensive?</h1>
      <p class="lede" data-text>One ticket carries more than the cost of your seat.</p>
    </div>
    <div class="stage" data-required="airplane and ticket">
      <svg class="illustration" viewBox="0 0 790 530" role="img" aria-labelledby="hook-art">
        <title id="hook-art">Paper airplane cutout rising over an unlabeled price area on a boarding ticket</title>
        <path d="M96 210C131 126 257 63 437 68c148 4 267 83 285 184 11 112-97 208-271 218C268 480 39 394 96 210Z" fill="#e5dcc9"/>
        <path d="M74 193c40-18 161-61 230-46M69 207c92-24 157-34 210-24" fill="none" stroke="#c6b79b" stroke-width="3" stroke-dasharray="8 12"/>
        <g transform="translate(159 267) rotate(8 240 97)" class="cutout">
          <path d="M8 12H458V65c-34 0-34 55 0 55v53H8v-53c34 0 34-55 0-55Z" fill="#fff9ee" stroke="#252a30" stroke-width="3"/>
          <path d="M342 19v147" stroke="#59758d" stroke-width="3" stroke-dasharray="6 8"/>
          <path d="M33 38h280v36H33Z" fill="#DAB357"/>
          <path d="M44 97h204M44 119h125M44 141h153" stroke="#c4b69a" stroke-width="5" stroke-linecap="round"/>
          <path d="M362 54v75m8-75v75m13-75v75m6-75v75m13-75v75m13-75v75m8-75v75" stroke="#252a30" stroke-width="3"/>
        </g>
        <g transform="translate(120 164) rotate(-13 270 86)" class="cutout">
          <path d="M31 94 13 47l27-1 65 48H488c30 0 54 19 65 29-29 22-53 31-98 31H106L42 177l-26-5 22-42Z" fill="#fff9ee" stroke="#252a30" stroke-width="4"/>
          <path d="M247 95 185 15l39-4 121 83Zm20 35-79 106 54-6 124-99Z" fill="#59758D" stroke="#252a30" stroke-width="4" stroke-linejoin="round"/>
          <path d="M130 111h11m14 0h11m14 0h11m15 0h11m160 0h11m14 0h11m14 0h11m14 0h11" stroke="#427361" stroke-width="7" stroke-linecap="round"/>
          <path d="M512 111l11 12 21-1" fill="none" stroke="#BF5942" stroke-width="5" stroke-linecap="round"/>
        </g>
        <path class="connector" d="M629 390q75-2 98-73m-22 12 22-12 4 23"/>
        <path d="m654 111 14-25m1 32 28-10m-34 20 25 9" stroke="#BF5942" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>
  </section>
</template>
<template id="mechanism">
  <section class="mechanism" data-required="cost diagram">
    <p class="section" data-text>Cost mechanism</p>
    <h1 data-text>What it takes to fly</h1>
    <p class="lede" data-text>A flight draws on several kinds of operating costs.</p>
    <div class="diagram">
      <div class="hub" data-text>Airline operating costs</div>
      <svg class="branches" viewBox="0 0 1000 50" preserveAspectRatio="none" aria-hidden="true">
        <path class="connector branch-horizontal" vector-effect="non-scaling-stroke" d="M499 0q-4 13 2 19M128 20q363-5 745 0M128 20v26m249-29v29m247-29v29m249-26v26"/>
        <path class="connector branch-portrait" vector-effect="non-scaling-stroke" d="M499 0q-4 13 2 19M250 20q250-5 500 0M250 20v26m500-26v26"/>
      </svg>
      <div class="cards">
        <section class="card"><svg class="icon" aria-hidden="true"><use href="#fuel"/></svg><h2 data-text>Fuel</h2><p data-text>Energy to move the aircraft.</p></section>
        <section class="card"><svg class="icon" aria-hidden="true"><use href="#people"/></svg><h2 data-text>People</h2><p data-text>Flight crew and ground staff.</p></section>
        <section class="card"><svg class="icon" aria-hidden="true"><use href="#tools"/></svg><h2 data-text>Aircraft</h2><p data-text>Ownership or leases, plus upkeep.</p></section>
        <section class="card"><svg class="icon" aria-hidden="true"><use href="#terminal"/></svg><h2 data-text>Airports</h2><p data-text>Landing and other airport charges.</p></section>
      </div>
      <p class="note" data-text><span class="chip">Category map</span> Examples only. Card size does not represent a share.</p>
    </div>
  </section>
</template>
<template id="closing">
  <section class="split takeaway" style="height:100%">
    <div data-required="takeaway copy">
      <p class="section" data-text>The takeaway</p>
      <h1 data-text>Same route.<br>Different fare.</h1>
      <p class="lede" data-text>Operating costs matter. So does demand for the seats on your flight.</p>
    </div>
    <div class="factors" data-required="takeaway factors">
      <section class="factor"><svg class="icon" aria-hidden="true"><use href="#fuel"/></svg><h2 data-text>Cost to fly</h2><p data-text>What it takes to operate the flight.</p></section>
      <section class="factor"><svg class="icon" aria-hidden="true"><use href="#seat"/></svg><h2 data-text>Seat demand</h2><p data-text>How many people want to travel then.</p></section>
      <svg class="merge" viewBox="0 0 660 65" aria-hidden="true"><path class="connector" d="M149 4q25 42 171 50M510 4q-26 41-176 50m-16-12 15 12-17 7"/><path d="M284 14l9 13m85-15-8 13" fill="none" stroke="#BF5942" stroke-width="4" stroke-linecap="round"/></svg>
      <div class="action" data-text>Compare nearby dates if you can.</div>
    </div>
  </section>
</template>
<script>
const copy = {
  hook: ['Hook', 'Why does a plane ticket cost so much?', 'हवाई टिकट इतना महँगा क्यों होता है?'],
  mechanism: ['Mechanism', 'Airlines pay for fuel, people, aircraft and airports.'],
  closing: ['Takeaway', 'For the same route, compare fares on nearby dates.'],
};
const requested = new URLSearchParams(location.search).get('scene') || 'hook';
const key = Object.hasOwn(copy, requested) ? requested : 'hook';
document.querySelector('#scene').append(document.getElementById(key).content.cloneNode(true));
const [name, caption, hindi] = copy[key];
document.querySelector('#sequence').textContent = name;
const footer = document.querySelector('#caption');
footer.textContent = caption;
if (hindi) {
  const translation = document.createElement('span');
  translation.className = 'indic';
  translation.lang = 'hi-IN';
  translation.textContent = hindi;
  footer.append(translation);
}
</script>
</html>
