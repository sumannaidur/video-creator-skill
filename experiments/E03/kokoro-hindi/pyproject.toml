[project]
name = "kokoro-hindi-experiment"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["kokoro==0.9.4", "soundfile", "torch"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
