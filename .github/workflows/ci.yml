# P026.4 continuous integration. Third-party actions are pinned to full commit SHAs (tag noted beside each).
# Narration runtimes (Mithi, Kokoro models) are not available on CI runners: those suites are reported SKIPPED, never passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Metadata, references, licensing and deterministic packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Repository consistency (Agent Skills metadata, links, LICENSE, notices, package hygiene)
        run: python tools/check_repository.py
      - name: Deterministic packaging (LF and CRLF staging copies with different timestamps must build identical archives)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          cp -r skills/video-creator "$RUNNER_TEMP/a/"
          cp -r skills/video-creator "$RUNNER_TEMP/b/"
          python - "$RUNNER_TEMP/b/video-creator" <<'EOF'
          import os, sys, time
          from pathlib import Path
          for p in Path(sys.argv[1]).rglob("*"):
              if p.is_file():
                  data = p.read_bytes()
                  if b"\0" not in data[:8192]:
                      try:
                          data.decode("utf-8")
                          p.write_bytes(data.replace(b"\r\n", b"\n").replace(b"\n", b"\r\n"))
                      except UnicodeDecodeError:
                          pass
                  os.utime(p, (time.time() - 86400 * 400, time.time() - 86400 * 400))
          EOF
          python tools/build_release.py --source "$RUNNER_TEMP/a/video-creator" --date 2026-11-27 --version ci --out "$RUNNER_TEMP/out-a"
          python tools/build_release.py --source "$RUNNER_TEMP/b/video-creator" --date 2026-11-27 --version ci --out "$RUNNER_TEMP/out-b"
          cmp "$RUNNER_TEMP/out-a/video-creator-vci.zip" "$RUNNER_TEMP/out-b/video-creator-vci.zip"
          cat "$RUNNER_TEMP/out-a/video-creator-vci.zip.sha256"

  tests:
    name: Tests (${{ matrix.where }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        where: [source, extracted-package]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: FFmpeg and Indic-capable fonts (CI environment only; not project dependencies)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-core
      - name: Locate the package under test
        run: |
          set -euo pipefail
          if [ "${{ matrix.where }}" = "source" ]; then
            echo "PKG=$GITHUB_WORKSPACE/skills/video-creator" >> "$GITHUB_ENV"
          else
            python tools/build_release.py --source skills/video-creator --date 2026-11-27 --version ci --out "$RUNNER_TEMP/dist"
            mkdir -p "$RUNNER_TEMP/extracted"
            python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/dist/video-creator-vci.zip" "$RUNNER_TEMP/extracted"
            echo "PKG=$RUNNER_TEMP/extracted/video-creator" >> "$GITHUB_ENV"
          fi
      - name: Run tests (core, node, browser, ffmpeg; runtime suites need local narration models and are skipped)
        working-directory: ${{ runner.temp }}
        env:
          VC_CHROME: /usr/bin/google-chrome
        run: python "$PKG/scripts/tests/run_all.py" --only core,node,browser,ffmpeg --json "$RUNNER_TEMP/test-results-${{ matrix.where }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.where }}
          path: ${{ runner.temp }}/test-results-${{ matrix.where }}.json
          if-no-files-found: warn
